<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <rect width="1280" height="720" fill="#020817"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="36" fill="#f8fafc" font-weight="bold">Escalado temporal de Grafana</text>
  <rect x="60" y="110" width="1160" height="210" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="170" font-family="Courier New, monospace" font-size="24" fill="#f8fafc">kubectl -n observabilidad scale deployment/grafana --replicas=2</text>
  <text x="90" y="210" font-family="Courier New, monospace" font-size="22" fill="#34d399">deployment.apps/grafana scaled</text>
  <text x="90" y="255" font-family="Courier New, monospace" font-size="22" fill="#f8fafc">kubectl -n observabilidad get deployment,replicaset,pods</text>
  <text x="90" y="295" font-family="Courier New, monospace" font-size="22" fill="#60a5fa">NAME                     DESIRED   CURRENT   READY</text>
  <text x="90" y="330" font-family="Courier New, monospace" font-size="22" fill="#d1d5db">deployment.apps/grafana   2         2         2</text>
  <rect x="60" y="370" width="1160" height="250" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="430" font-family="Arial, sans-serif" font-size="26" fill="#fbbf24" font-weight="bold">Resultado esperado</text>
  <text x="90" y="485" font-family="Arial, sans-serif" font-size="24" fill="#e2e8f0">Pod 1: grafana-xxxxx-abcde  • Running</text>
  <text x="90" y="525" font-family="Arial, sans-serif" font-size="24" fill="#e2e8f0">Pod 2: grafana-xxxxx-fghij  • Running</text>
  <text x="90" y="565" font-family="Arial, sans-serif" font-size="24" fill="#e2e8f0">Luego se vuelve a una réplica: deployment.apps/grafana scaled to 1</text>
</svg>
